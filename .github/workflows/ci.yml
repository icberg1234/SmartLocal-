name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# This repo holds the SmartLocal *module overlay* (custom code), not a full Laravel
# app. CI scaffolds a fresh Laravel 11 app, applies the overlay, and runs the gate.
# (A vanilla `composer create-project` once on a PHP env converts it to a normal repo.)
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run test
      - run: npm run build

  gate:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: smartlocal
          MYSQL_ROOT_PASSWORD: secret
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -psecret"
          --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, redis, bcmath, intl
          coverage: none

      - name: Scaffold fresh Laravel 11
        run: composer create-project laravel/laravel:^11 app --no-interaction --prefer-dist

      - name: Apply SmartLocal overlay
        run: |
          mkdir -p app/app/Http/Middleware app/app/Providers app/database/factories app/database/seeders app/tests/Feature
          cp -r overlay/app/Modules app/app/
          cp overlay/app/Http/Middleware/ResolveTenant.php app/app/Http/Middleware/
          cp overlay/app/Providers/ModuleServiceProvider.php app/app/Providers/
          cp overlay/bootstrap/app.php app/bootstrap/app.php
          cp overlay/bootstrap/providers.php app/bootstrap/providers.php
          cp overlay/routes/api.php app/routes/api.php
          cp overlay/app/Models/User.php app/app/Models/
          cp overlay/config/auth.php app/config/auth.php
          cp overlay/config/services.php app/config/services.php
          cp overlay/config/smartlocal.php app/config/smartlocal.php
          cp overlay/database/factories/MallFactory.php app/database/factories/
          cp overlay/database/seeders/*.php app/database/seeders/
          cp overlay/tests/Pest.php app/tests/Pest.php
          cp overlay/tests/Feature/*.php app/tests/Feature/
          cp overlay/phpstan.neon app/phpstan.neon
          cp overlay/pint.json app/pint.json
          cp overlay/.env.example app/.env.example

      - name: Install packages (sanctum, spatie, pest, larastan)
        working-directory: app
        run: |
          composer require laravel/sanctum spatie/laravel-permission --no-interaction
          composer require --dev pestphp/pest pestphp/pest-plugin-laravel larastan/larastan --no-interaction --with-all-dependencies
          php artisan vendor:publish --provider="Spatie\Permission\PermissionServiceProvider" --no-interaction
          php artisan vendor:publish --provider="Laravel\Sanctum\SanctumServiceProvider" --no-interaction

      - name: Prepare env
        working-directory: app
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          DB_HOST: 127.0.0.1
          REDIS_HOST: 127.0.0.1

      # Auto-format (not --test) for now: source is hand-authored without a local PHP env.
      # TODO(ratchet): switch back to `pint --test` once formatted on a PHP env.
      - name: Pint (auto-format our code)
        working-directory: app
        run: vendor/bin/pint app/Modules app/Models app/Http/Middleware app/Providers/ModuleServiceProvider.php tests

      - name: PHPStan (larastan, level 6)
        working-directory: app
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: Migrate + Pest
        working-directory: app
        run: |
          php artisan migrate --seed --no-interaction
          vendor/bin/pest
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: smartlocal
          DB_USERNAME: root
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1

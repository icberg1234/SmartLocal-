services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: smartlocal-app
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - mysql
      - redis
    environment:
      - PHP_IDE_CONFIG=serverName=smartlocal

  nginx:
    image: nginx:1.27-alpine
    container_name: smartlocal-nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: smartlocal-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: smartlocal
      MYSQL_USER: smartlocal
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: smartlocal-redis
    ports:
      - "6379:6379"

volumes:
  mysql-data:
